# Keeps public/data fresh from SFU's public APIs. main only takes changes
# through pull requests, so each update goes in as its own PR that this
# workflow merges once the checks below pass; that redeploys the site. Each run:
#   - every day: seat counts (SFU posts a new snapshot daily in registration)
#   - Mondays:   sections, times and instructors too
#   - the 1st:   everything (courses, descriptions, programs; ~15 minutes)
# Run it by hand from the Actions tab (pick a mode) after a big calendar change.
# If the new data looks broken (scripts/check-data.ts), no PR is opened and
# GitHub emails you that the run failed.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests".

name: Refresh course data

on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC = 5–6 am in Vancouver
  workflow_dispatch:
    inputs:
      mode:
        description: What to refresh
        type: choice
        options: [seats, offerings, full]
        default: offerings

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pick what to refresh
        id: mode
        run: |
          mode='${{ inputs.mode }}'
          if [ -z "$mode" ]; then
            if [ "$(date -u +%d)" = 01 ]; then mode=full
            elif [ "$(date -u +%u)" = 1 ]; then mode=offerings
            else mode=seats; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Refreshing: $mode"

      - name: Keep a copy of the current data
        run: cp -r public/data "$RUNNER_TEMP/data-before"

      - name: Fetch everything
        if: steps.mode.outputs.mode == 'full'
        run: npm run fetch-data

      - name: Fetch sections and seats
        if: steps.mode.outputs.mode == 'offerings'
        run: npm run fetch-offerings && npm run fetch-seats

      - name: Fetch seats
        if: steps.mode.outputs.mode == 'seats'
        run: npm run fetch-seats

      - name: Check the new data
        run: node scripts/check-data.ts "$RUNNER_TEMP/data-before"

      # The degree and prerequisite tests run against the real data files.
      - run: npm test

      - name: Open and merge a PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "No data changes."
            exit 0
          fi
          mode='${{ steps.mode.outputs.mode }}'
          day=$(date -u +%Y-%m-%d)
          branch="data/refresh-$day-$mode-${{ github.run_id }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add public/data
          git commit -m "Refresh course data ($mode, $day)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh course data ($mode, $day)" \
            --body "Automatic data refresh (run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). The data check and tests passed before this PR was opened."
          gh pr merge "$branch" --squash --delete-branch
